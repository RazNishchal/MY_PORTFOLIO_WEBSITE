<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Nishchal Raj Subedi</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
    
    <style>
        /* --- CORE RESPONSIVE SETUP --- */
        :root {
            --bg-color: #000;
            --text-main: #fff;
            --text-dim: #aaa;
            --accent: #fff;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- FLUID TYPOGRAPHY --- */
        /* clamp(min, preferred, max) ensures text scales with screen size */
        .header-title {
            font-family: 'League Spartan';
            font-size: clamp(3.5rem, 15vw, 8rem); 
            line-height: 0.9;
            text-align: center;
        }

        .header-text {
            font-size: clamp(0.8rem, 3vw, 1.2rem);
            letter-spacing: clamp(4px, 1vw, 10px);
            color: #888;
            text-align: center;
            margin-top: 10px;
        }

        /* --- ABOUT SECTION --- */
        .about-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-top: 50px;
        }

        @media (max-width: 900px) {
            .about-grid { grid-template-columns: 1fr; }
        }

        .bio-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: clamp(20px, 5vw, 50px);
            border-radius: 20px;
        }

        .bio-card h2 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            margin-bottom: 15px;
        }

        /* --- PROJECTS GRID --- */
        .projects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 60px;
        }

        @media (max-width: 1024px) {
            .projects { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 600px) {
            .projects { grid-template-columns: 1fr; }
        }

        .project { width: 100%; }

        /* RESPONSIVE IMAGES */
        .project-image img {
            width: 100%;
            /* Use aspect-ratio instead of fixed height for mobile scaling */
            aspect-ratio: 16 / 10; 
            object-fit: cover;
            border-radius: 12px;
            transition: 0.4s ease;
        }

        /* --- SKILLS GRID --- */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 20px;
        }

        .skill-item img {
            width: clamp(30px, 8vw, 45px); /* Icons get smaller on mobile */
        }

        /* --- FOOTER --- */
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 40px 0;
            border-top: 1px solid #222;
        }

        @media (max-width: 700px) {
            .footer-content { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <header style="padding: 80px 0 40px;">
        <div class="container">
            <h1 class="header-title">NISHCHAL</h1>
            <p class="header-text">WEB-DEVELOPER</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            
            <div class="about-grid">
                <div class="bio-card">
                    <h2 style="font-family: 'League Spartan';">Full-Stack Engineering</h2>
                    <p style="color: var(--text-dim); line-height: 1.5; font-size: 1rem;">
                        Bridging the gap between <strong>Architectural Logic</strong> and <strong>Interactive Design</strong>. 
                        Currently at <span style="color: #fff;">Kathmandu University</span>.
                    </p>
                    <a href="#" style="display:inline-block; margin-top:20px; background:#fff; color:#000; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:700; font-size:0.8rem;">Download CV</a>
                </div>

                <div class="skills-grid">
                    <div class="skill-item" style="text-align:center;">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nextjs/nextjs-original.svg" style="filter: invert(1);" alt="Next" />
                        <p style="font-size:0.6rem; color:#888;">NEXT.JS</p>
                    </div>
                    <div class="skill-item" style="text-align:center;">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React" />
                        <p style="font-size:0.6rem; color:#888;">REACT</p>
                    </div>
                    <div class="skill-item" style="text-align:center;">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" alt="Node" />
                        <p style="font-size:0.6rem; color:#888;">NODE</p>
                    </div>
                    <div class="skill-item" style="text-align:center;">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg" alt="SQL" />
                        <p style="font-size:0.6rem; color:#888;">SQL</p>
                    </div>
                    <div class="skill-item" style="text-align:center;">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg" alt="TS" />
                        <p style="font-size:0.6rem; color:#888;">TS</p>
                    </div>
                    <div class="skill-item" style="text-align:center;">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python" />
                        <p style="font-size:0.6rem; color:#888;">PYTHON</p>
                    </div>
                </div>
            </div>

            <div class="projects">
                <div class="project">
                    <div style="font-size:0.7rem; color:#888; margin-bottom:5px;">KAVRE GUIDE</div>
                    <div class="project-image"><img src="../images/KavreGuide.png" alt="Project" /></div>
                </div>
                <div class="project">
                    <div style="font-size:0.7rem; color:#888; margin-bottom:5px;">PHAL SABJI SANJAAL</div>
                    <div class="project-image"><img src="../images/Phal.png" alt="Project" /></div>
                </div>
                <div class="project">
                    <div style="font-size:0.7rem; color:#888; margin-bottom:5px;">PORTFOLIO</div>
                    <div class="project-image"><img src="../images/Portfolio.png" alt="Project" /></div>
                </div>
                </div>

        </div>
    </section>

    <footer style="margin-top: 80px;">
        <div class="container">
            <div class="footer-content">
                <div style="display:flex; gap:15px; font-size:0.7rem;">
                    <span>PROJECTS</span> <span>ABOUT</span> <span>CONTACT</span>
                </div>
                <div style="font-size:0.8rem; color:#888;">
                    nishchalrj2316@gmail.com
                </div>
            </div>
        </div>
    </footer>

</body>
</html>

    <style>
      body {
        background: #000;
        color: #fff;
        margin: 0;
        overflow-x: hidden;
      }

      .container {
        width: 92%;
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        padding: 120px 0 40px;
        text-align: center;
      }

      .header-title {
        font-family: 'League Spartan', sans-serif;
        font-size: clamp(2.5rem, 8vw, 6rem);
        margin: 0;
      }

      /* --- 3:3 GRID LAYOUT --- */
      .projects {
        display: grid;
        /* Forced 3 columns for desktop */
        grid-template-columns: repeat(3, 1fr); 
        gap: 30px;
        margin-top: 30px;
        width: 100%;
      }

      /* --- HOVER EFFECTS (ACTIVE ON ALL SCREENS) --- */
      .project {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 20px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
      }

      .project:hover {
        transform: translateY(-10px) scale(1.02);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      }

      .project-image {
        width: 100%;
        overflow: hidden;
        border-radius: 10px;
      }

      .project-image img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.6s ease;
      }

      .project:hover .project-image img {
        transform: scale(1.1);
      }

      .project-title {
        font-family: 'League Spartan', sans-serif;
        color: #888;
        margin-bottom: 12px;
        font-size: 1.1rem;
        transition: color 0.3s;
      }

      .project:hover .project-title {
        color: #fff;
      }

      .drive-button {
        display: block;
        width: fit-content;
        margin: 0 auto 50px;
        background: #fff;
        color: #000;
        padding: 14px 35px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .drive-button:hover {
        transform: scale(1.05);
        background: #e0e0e0;
      }

      /* --- FOOTER RESPONSIVE FIX --- */
      .footer {
        padding: 80px 0 40px;
        border-top: 1px solid #222;
        margin-top: 100px;
      }

      .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 30px;
      }

      .footer-frame {
        display: flex;
        gap: 25px;
      }

      .footer-frame a {
        color: #fff;
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 1px;
        transition: opacity 0.3s;
      }

      .footer-frame a:hover { opacity: 0.6; }

      .footer-title {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .footer-texts a {
        color: #888;
        text-decoration: none;
        font-size: 0.9rem;
        display: block;
        margin-bottom: 5px;
      }

      /* --- MOBILE ADJUSTMENTS --- */
      @media (max-width: 1024px) {
        .projects { grid-template-columns: repeat(2, 1fr); } /* 2 columns for tablets */
      }

      @media (max-width: 768px) {
        .projects { grid-template-columns: 1fr; } /* 1 column for phones */
        
        .footer-content {
          flex-direction: column;
          text-align: center;
          gap: 50px;
        }

        .footer-frame { justify-content: center; width: 100%; }
        .footer-title { flex-direction: column; gap: 15px; }
      }
    </style>

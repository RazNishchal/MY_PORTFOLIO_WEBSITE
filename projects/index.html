<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | Nishchal Raj Subedi</title>
    <link rel="shortcut icon" href="../images/rpLogoBlack.svg" type="image/x-icon" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=League+Spartan:wght@400;700&display=swap" rel="stylesheet" />

    <style>
      body {
        background: #000;
        color: #fff;
        margin: 0;
        overflow-x: hidden;
      }

      .container {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* --- FIXED SIDE MENU (RIGHT SIDE) --- */
      .menu {
        position: fixed;
        top: 0;
        right: -100%; /* Hidden off-screen to the right */
        width: 350px; 
        height: 100%;
        background: #fff; /* White background as per your logo logic */
        z-index: 10000;
        transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
        color: #000;
        padding: 60px 40px;
        box-sizing: border-box;
        box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      }

      /* This class is toggled by JavaScript */
      .menu.active {
        right: 0; 
      }

      .list-menu ul {
        list-style: none;
        padding: 0;
        margin-top: 50px;
      }

      .list-menu li {
        margin-bottom: 30px;
      }

      .list-menu a {
        text-decoration: none;
        color: #000;
        font-family: 'League Spartan', sans-serif;
        font-size: 2.5rem;
        font-weight: 700;
        transition: 0.3s;
      }

      .list-menu a:hover {
        padding-left: 10px;
        opacity: 0.6;
      }

      /* --- 3:3 GRID LAYOUT --- */
      .projects {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 30px;
        margin-top: 50px;
      }

      /* --- HOVER EFFECTS (STAYS ON ALL SCREENS) --- */
      .project {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 20px;
        transition: all 0.4s ease;
      }

      .project:hover {
        transform: translateY(-10px);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.4);
      }

      .project-image img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
      }

      /* --- FOOTER RESPONSIVE --- */
      .footer {
        padding: 80px 0;
        border-top: 1px solid #222;
        margin-top: 100px;
      }

      .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* --- MOBILE OVERRIDES --- */
      @media (max-width: 1024px) {
        .projects { grid-template-columns: repeat(2, 1fr); }
      }

      @media (max-width: 768px) {
        .menu { width: 100%; } /* Full screen menu on mobile */

        .projects { grid-template-columns: 1fr; }
        
        .footer-content {
          flex-direction: column;
          text-align: center;
          gap: 40px;
        }

        .footer-frame { justify-content: center; display: flex; gap: 20px; }
        .footer-title { flex-direction: column; gap: 15px; }
      }
    </style>
  </head>
  <body>

    <div class="home-banner" style="display: flex; justify-content: space-between; padding: 25px; align-items: center; position: relative; z-index: 999;">
      <div class="home-icon">
        <img src="../images/rpLogoWhite.svg" alt="logo" width="45" />
      </div>
      <div class="home-panel" id="open-menu" style="cursor: pointer;">
        <img src="../images/3_white.svg" alt="menu" width="35" />
      </div>
    </div>

    <div class="menu" id="side-menu">
      <div id="close-menu" style="cursor: pointer; text-align: right;">
        <img src="../images/X_white.svg" alt="close" style="filter: invert(1); width: 35px;" />
      </div>
      <div class="list-menu">
        <ul>
          <li><a href="../project_home/index.html">Home</a></li>
          <li><a href="../about/index.html">About</a></li>
          <li><a href="../contact/index.html">Contact</a></li>
          <li><a href="../index.html">Exit</a></li>
        </ul>
      </div>
    </div>

    <header class="header" style="text-align: center; padding-top: 40px;">
      <div class="container">
        <h1 class="header-title" style="font-family: 'League Spartan'; font-size: clamp(3rem, 10vw, 6rem); margin: 0;">MY PROJECTS</h1>
        <p class="header-text" style="color: #888; letter-spacing: 5px; margin-top: 10px;">MADE WITH LOVE</p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="projects">
          <div class="project">
            <div style="font-family: 'League Spartan'; color: #888; margin-bottom: 10px;">KAVRE GUIDE</div>
            <div class="project-image">
              <a href="#"><img src="../images/KavreGuide.png" alt="Project" /></a>
            </div>
          </div>
          <div class="project">
            <div style="font-family: 'League Spartan'; color: #888; margin-bottom: 10px;">PHAL SABJI SANJAAL</div>
            <div class="project-image">
              <a href="#"><img src="../images/Phal.png" alt="Project" /></a>
            </div>
          </div>
          <div class="project">
            <div style="font-family: 'League Spartan'; color: #888; margin-bottom: 10px;">PORTFOLIO WEBSITE</div>
            <div class="project-image">
              <a href="#"><img src="../images/Portfolio.png" alt="Project" /></a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-frame">
            <a href="../project_home/index.html" style="color:#fff; text-decoration:none;">HOME</a>
            <a href="../about/index.html" style="color:#fff; text-decoration:none;">ABOUT</a>
            <a href="../contact/index.html" style="color:#fff; text-decoration:none;">CONTACT</a>
          </div>
          <div class="footer-title">
            <img src="../images/rpLogoWhite.svg" alt="logo" width="40" />
            <div class="footer-texts">
              <a href="mailto:nishchalrj2316@gmail.com" style="color:#888; text-decoration:none; display:block;">nishchalrj2316@gmail.com</a>
              <a href="tel:+9779865512865" style="color:#888; text-decoration:none;">+977 9865512865</a>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script>
      const openBtn = document.getElementById('open-menu');
      const closeBtn = document.getElementById('close-menu');
      const sideMenu = document.getElementById('side-menu');

      openBtn.addEventListener('click', () => {
        sideMenu.classList.add('active');
      });

      closeBtn.addEventListener('click', () => {
        sideMenu.classList.remove('active');
      });

      // Close menu if clicking outside of it
      document.addEventListener('click', (event) => {
        if (!sideMenu.contains(event.target) && !openBtn.contains(event.target)) {
          sideMenu.classList.remove('active');
        }
      });
    </script>
    
    <script src="https://unpkg.com/magic-snowflakes/dist/snowflakes.min.js"></script>
    <script>new Snowflakes();</script>
  </body>
</html>
